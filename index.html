<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b4a"><link rel="manifest" href="manifest.webmanifest"><title>Tennis-Abrechnung</title><style>
:root{font-family:system-ui,Arial;color:#18352a;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}header{background:#176b4a;color:white;padding:18px 16px;font-size:22px;font-weight:700}main{max-width:700px;margin:auto;padding:16px 16px 90px}.card{background:white;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #153d2012}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #ddd;justify-content:space-around;padding:9px}button{border:0;background:#176b4a;color:white;padding:11px 14px;border-radius:9px;font-size:15px}nav button{background:transparent;color:#176b4a;padding:8px}button.secondary{background:#e1eee6;color:#176b4a}button.danger{background:#a33434}input{width:100%;padding:11px;border:1px solid #a7b9ad;border-radius:8px;font-size:16px;margin:5px 0 12px}label{display:block;margin-top:8px}h2{margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row input[type=checkbox]{width:22px;height:22px;margin:8px}.muted{color:#687b70;font-size:13px}.hidden{display:none}.chip{padding:5px 8px;background:#e1eee6;border-radius:7px}.negative{color:#a33434}section{display:none}section.active{display:block}
</style></head><body><header>Tennis-Abrechnung</header><main>
<section id="home" class="active"><h2>Übersicht</h2><div id="stats"></div><h3>Offene Zahlungen</h3><div id="open"></div></section>
<section id="appointments"><div class="row"><h2>Termine</h2><button onclick="editSession()">+ Termin</button></div><div id="sessionList"></div></section>
<section id="people"><h2>Teilnehmerinnen</h2><p class="muted">Tippe auf einen Namen, um ihn zu ändern.</p><div id="peopleList"></div></section>
<section id="report"><h2>Auswertung</h2><label>Von<input type="date" id="from"></label><label>Bis<input type="date" id="to"></label><div id="reportStats"></div><button onclick="exportPDF()">Als PDF drucken / speichern</button><p class="muted">Im Druckdialog deines Smartphones „Als PDF speichern“ auswählen.</p><button class="secondary" onclick="backup()">Datensicherung herunterladen (JSON)</button><label>Datensicherung wiederherstellen<input type="file" accept=".json,application/json" onchange="restore(event)"></label></section>
<section id="editor"><h2 id="editorTitle">Termin</h2><label>Datum<input type="date" id="date"></label><label>Hallenkosten (€)<input id="hall" inputmode="decimal" value="20" oninput="preview()"></label><label>Lichtgeld (€)<input id="light" inputmode="decimal" value="2" oninput="preview()"></label><h3>Teilnehmerinnen (maximal 4)</h3><div id="choices"></div><label>Preis pro Person (€), manuell änderbar<input id="unit" inputmode="decimal" oninput="manual=true;preview()"></label><button class="secondary" onclick="manual=false;preview()">Automatischen Preis übernehmen</button><div id="preview" class="card"></div><div class="row"><button onclick="saveSession()">Speichern</button><button class="secondary" onclick="show('appointments')">Abbrechen</button></div><button id="deleteBtn" class="danger" onclick="deleteSession()">Termin löschen</button></section>
</main><nav><button onclick="show('home')">Start</button><button onclick="show('appointments')">Termine</button><button onclick="show('people')">Personen</button><button onclick="show('report')">Auswertung</button></nav><script>
const KEY='tennisabrechnung_v1';
let state=load(),editing=null,manual=false;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.people)&&Array.isArray(x.sessions))return x}catch(e){}return {people:Array.from({length:7},(_,i)=>({id:i+1,name:'Teilnehmerin '+(i+1)})),sessions:[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function euro(c){return(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function cents(s){const n=Number(String(s).replace(',','.'));return Number.isFinite(n)&&n>=0?Math.round(n*100):null}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));render();scrollTo(0,0)}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function byId(id){return document.getElementById(id)}
function render(){
const all=state.sessions,charges=all.flatMap(s=>s.entries),income=charges.reduce((a,e)=>a+e.amount,0),cost=all.reduce((a,s)=>a+s.hall+s.light,0),paid=charges.filter(e=>e.paid).reduce((a,e)=>a+e.amount,0);
byId('stats').innerHTML=[['Verdienst (alle Termine)',euro(income-cost)],['Einnahmen',euro(income)],['Halle und Licht',euro(cost)],['Offene Zahlungen',euro(income-paid)]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><h2>${v}</h2></div>`).join('');
byId('open').innerHTML=charges.filter(e=>!e.paid).map(e=>{const s=all.find(s=>s.entries.includes(e));return `<div class="card row"><span>${safe(name(e.person))}<div class="muted">${safe(s.date)}</div></span><span>${euro(e.amount)} <button onclick="togglePaid(${s.id},${e.person})">Bezahlt</button></span></div>`}).join('')||'<p>Keine offenen Zahlungen.</p>';
byId('sessionList').innerHTML=[...all].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="card" onclick="editSession(${s.id})"><div class="row"><strong>${safe(s.date)}</strong><span>${s.entries.length} Personen</span></div><p>Einnahmen: ${euro(s.entries.reduce((a,e)=>a+e.amount,0))} · Kosten: ${euro(s.hall+s.light)}</p><span class="muted">${s.entries.filter(e=>!e.paid).length} offene Zahlungen · Antippen zum Bearbeiten</span></div>`).join('')||'<p>Noch keine Termine.</p>';
byId('peopleList').innerHTML=state.people.map(p=>`<div class="card row"><strong>${safe(p.name)}</strong><button onclick="rename(${p.id})">Ändern</button></div>`).join('');
renderReport();
}
function name(id){return state.people.find(p=>p.id===id)?.name||'Unbekannt'}
function rename(id){const p=state.people.find(p=>p.id===id);const n=prompt('Name der Teilnehmerin:',p.name);if(n&&n.trim()){p.name=n.trim();persist()}}
function togglePaid(id,pid){const s=state.sessions.find(s=>s.id===id),e=s.entries.find(e=>e.person===pid);e.paid=!e.paid;persist()}
function editSession(id){editing=id??null;manual=false;const s=state.sessions.find(s=>s.id===id);byId('editorTitle').textContent=s?'Termin bearbeiten':'Neuer Termin';byId('date').value=s?.date||new Date().toLocaleDateString('en-CA');byId('hall').value=s?String(s.hall/100).replace('.',','):'20';byId('light').value=s?String(s.light/100).replace('.',','):'2';byId('choices').innerHTML=state.people.map(p=>`<label class="row card"><span>${safe(p.name)}</span><input type="checkbox" class="choice" value="${p.id}" ${s?.entries.some(e=>e.person===p.id)?'checked':''} onchange="limitChoices(this);preview()"></label>`).join('');byId('unit').value=s?.entries.length?String(s.entries[0].amount/100).replace('.',','):'';manual=!!s;byId('deleteBtn').style.display=s?'block':'none';show('editor');preview()}
function selected(){return [...document.querySelectorAll('.choice:checked')].map(x=>Number(x.value))}
function limitChoices(el){if(selected().length>4){el.checked=false;alert('Maximal vier Teilnehmerinnen.')}} 
function preview(){const h=cents(byId('hall').value),l=cents(byId('light').value),n=selected().length;if(h===null||l===null||!n){byId('preview').textContent='Bitte gültige Kosten und mindestens eine Teilnehmerin auswählen.';return}const suggested=Math.floor(((h+l+3000)/n)/50)*50;if(!manual)byId('unit').value=(suggested/100).toFixed(2).replace('.',',');const u=cents(byId('unit').value);byId('preview').innerHTML=`Preisvorschlag: <b>${euro(suggested)}</b> pro Person<br>Dein Verdienst: <b>${u===null?'–':euro(u*n-h-l)}</b>`}
function saveSession(){const date=byId('date').value,h=cents(byId('hall').value),l=cents(byId('light').value),u=cents(byId('unit').value),ids=selected();if(!date||h===null||l===null||u===null||ids.length<1||ids.length>4){alert('Bitte alle Angaben prüfen.');return}const old=state.sessions.find(s=>s.id===editing);const entries=ids.map(person=>({person,amount:u,paid:old?.entries.find(e=>e.person===person)?.paid||false}));const item={id:old?.id||Date.now(),date,hall:h,light:l,entries};if(old)state.sessions[state.sessions.indexOf(old)]=item;else state.sessions.push(item);persist();show('appointments')}
function deleteSession(){if(confirm('Termin wirklich löschen?')){state.sessions=state.sessions.filter(s=>s.id!==editing);persist();show('appointments')}}
function renderReport(){const from=byId('from').value,to=byId('to').value;const ss=state.sessions.filter(s=>(!from||s.date>=from)&&(!to||s.date<=to));const cc=ss.flatMap(s=>s.entries);const inc=cc.reduce((a,e)=>a+e.amount,0),cost=ss.reduce((a,s)=>a+s.hall+s.light,0),received=cc.filter(e=>e.paid).reduce((a,e)=>a+e.amount,0);byId('reportStats').innerHTML=`<div class="card"><p>Termine: ${ss.length}</p><p>Einnahmen: ${euro(inc)}</p><p>Kosten: ${euro(cost)}</p><h3>Verdienst: ${euro(inc-cost)}</h3><p>Erhalten: ${euro(received)} · Offen: ${euro(inc-received)}</p></div>`}
function exportPDF(){const f=byId('from').value,t=byId('to').value;const ss=state.sessions.filter(s=>(!f||s.date>=f)&&(!t||s.date<=t));const lines=ss.map(s=>`<h3>${safe(s.date)}</h3><p>Halle: ${euro(s.hall)} · Licht: ${euro(s.light)}</p><ul>${s.entries.map(e=>`<li>${safe(name(e.person))}: ${euro(e.amount)} (${e.paid?'bezahlt':'offen'})</li>`).join('')}</ul>`).join('');const stats=byId('reportStats').innerHTML;const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups für den PDF-Export erlauben.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Tennis-Abrechnung</title></head><body><h1>Tennis-Abrechnung</h1><p>${safe(f)} bis ${safe(t)}</p>${stats}${lines}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tennis-datensicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restore(ev){const file=ev.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!Array.isArray(x.people)||!Array.isArray(x.sessions))throw Error('Ungültige Datei');if(!confirm('Aktuelle Daten durch diese Sicherung ersetzen?'))return;state=x;persist();alert('Daten wiederhergestellt.')}catch(e){alert('Datensicherung konnte nicht gelesen werden.')}ev.target.value=''}
byId('from').value=new Date(new Date().getFullYear(),0,1).toLocaleDateString('en-CA');byId('to').value=new Date().toLocaleDateString('en-CA');byId('from').addEventListener('change',renderReport);byId('to').addEventListener('change',renderReport);render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
